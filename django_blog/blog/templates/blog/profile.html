<h2>Your Profile</h2>

<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <p>
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </p>
    {% endfor %}

    <button type="submit">Update Profile</button>
</form>

<a href="{% url 'logout' %}">Logout</a>
