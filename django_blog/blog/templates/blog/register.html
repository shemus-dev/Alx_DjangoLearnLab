<h2>Register</h2>

<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    {% for field in form %}
        <p>
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </p>
    {% endfor %}

    <button type="submit">Register</button>
</form>

<p>
    <a href="{% url 'login' %}">Already have an account?</a>
</p>
