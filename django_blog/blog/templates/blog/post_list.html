<h1>Blog Posts</h1>

{% if user.is_authenticated %}
    <a href="{% url 'post-create' %}">Create New Post</a>
{% endif %}

{% for post in posts %}
    <h2>
        <a href="{% url 'post-detail' post.pk %}">
            {{ post.title }}
        </a>
    </h2>
    <p>By {{ post.author }} | {{ post.created_at }}</p>
{% empty %}
    <p>No posts available.</p>
{% endfor %}
