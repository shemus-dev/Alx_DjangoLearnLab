<h1>{{ post.title }}</h1>
<p>{{ post.content }}</p>

<hr>

<h4>Tags:</h4>
{% if post.tags.all %}
    <ul>
        {% for tag in post.tags.all %}
            <li>
                <a href="{% url 'posts_by_tag' tag.id %}">
                    #{{ tag.name }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No tags</p>
{% endif %}
