<h2>Login</h2>

<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <p>
        {{ form.username.label_tag }}
        {{ form.username }}
        {{ form.username.errors }}
    </p>

    <p>
        {{ form.password.label_tag }}
        {{ form.password }}
        {{ form.password.errors }}
    </p>

    <button type="submit">Login</button>
</form>

<p>
    <a href="{% url 'register' %}">Create an account</a>
</p>
